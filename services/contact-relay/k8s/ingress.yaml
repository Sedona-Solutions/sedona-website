# Exposition publique en HTTPS. Exemple pour ingress-nginx + cert-manager :
# adapter la classe, l'émetteur de certificat et le nom d'hôte à votre cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contact-relay
  namespace: sedona-site # À ADAPTER
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt # À ADAPTER
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    # Limite complémentaire côté Ingress (requêtes par seconde et par IP).
    nginx.ingress.kubernetes.io/limit-rps: "2"
spec:
  ingressClassName: nginx # À ADAPTER
  tls:
    - hosts: [contact-api.sedona.fr] # À ADAPTER
      secretName: contact-relay-tls
  rules:
    - host: contact-api.sedona.fr # À ADAPTER
      http:
        paths:
          - path: /contact
            pathType: Exact
            backend:
              service: { name: contact-relay, port: { name: http } }
