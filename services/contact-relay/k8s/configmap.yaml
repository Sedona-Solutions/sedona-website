# Configuration non secrète du relais. La clé Brevo est dans le Secret
# « contact-relay-brevo » (cf. README.md), jamais dans ce fichier.
apiVersion: v1
kind: ConfigMap
metadata:
  name: contact-relay
  namespace: sedona-site # À ADAPTER
data:
  # Origines autorisées à appeler le relais (CORS), séparées par des virgules.
  ALLOWED_ORIGINS: "https://sedona.fr,https://www.sedona.fr,https://preview.sedona.fr"
  # Hôtes du formulaire acceptés par siteverify. Pas de localhost ici : réservé au .env local.
  TURNSTILE_HOSTNAMES: "sedona.fr,www.sedona.fr,preview.sedona.fr"
  # Expéditeur : doit être un expéditeur VALIDÉ dans Brevo (domaine authentifié).
  CONTACT_FROM_EMAIL: "noreply@sedona.fr" # À ADAPTER
  CONTACT_FROM_NAME: "Site sedona.fr"
  # Destinataire par défaut (plusieurs possibles, séparés par des virgules).
  CONTACT_TO: "contact@sedona.fr" # À ADAPTER
  # Routage optionnel par type de demande (vide = CONTACT_TO).
  CONTACT_TO_PROJET: ""
  CONTACT_TO_POSTULER: ""
  CONTACT_TO_AUTRE: ""
  # Optionnel : ID d'une liste Brevo où ajouter les prospects (demandes « projet »).
  BREVO_LIST_ID: ""
  # Anti-spam : 5 demandes max par IP toutes les 10 minutes.
  RATE_LIMIT_MAX: "5"
  RATE_LIMIT_WINDOW_S: "600"
