name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SITE_URL pilote canonical, sitemap ET indexation (src/utils/seo.ts) :
      # preview.sedona.fr => robots.txt « Disallow: / » + noindex sur toutes les pages.
      # Mise en production : passer à https://sedona.fr (et public/CNAME à sedona.fr).
      SITE_URL: https://preview.sedona.fr
      # Matomo Cloud (valeurs publiques, visibles dans le code des pages).
      # Le suivi ne s'active qu'en production (SITE_URL = https://sedona.fr).
      PUBLIC_MATOMO_URL: https://sedona.matomo.cloud/
      PUBLIC_MATOMO_SITE_ID: "1"
      # Relais formulaire de contact -> Brevo (services/contact-relay, Kubernetes Sedona).
      # À ADAPTER : URL publique de l'Ingress une fois le relais déployé.
      PUBLIC_CONTACT_ENDPOINT: https://contact-api.sedona.fr/contact
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:images -- --strict
        continue-on-error: true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
