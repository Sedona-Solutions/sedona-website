name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://preview.sedona.fr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Astro caches optimized images under node_modules/.astro/assets. Restored after
      # `npm ci`, which wipes node_modules — otherwise Sharp reprocesses every image
      # on each run.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          # Keyed on the sources, so an unchanged image set reuses the cache exactly
          # instead of re-uploading it on every run.
          key: astro-assets-${{ hashFiles('public/uploads/**', 'astro.config.mjs') }}
          restore-keys: astro-assets-
      - run: npm run build
      # Fails if a raster image is still served straight from /uploads/, i.e. outside
      # the optimization pipeline — and if any referenced asset is missing from dist.
      - run: npm run audit:images -- --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
